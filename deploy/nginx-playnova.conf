server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name playnova.ir www.playnova.ir;

    root /var/www/playnova/PlayNova/public;
    index index.php;

    client_max_body_size 64M;

    location ^~ /.well-known/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://playnova.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.playnova.ir;

    ssl_certificate /etc/nginx/ssl/playnova-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/playnova.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://playnova.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playnova.ir;

    ssl_certificate /etc/nginx/ssl/playnova-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/playnova.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    root /var/www/playnova/PlayNova/public;
    index index.php;

    client_max_body_size 64M;

    location ~ ^/(hero-slide-|social-|logo|playnova-logo|storage/) {
        try_files $uri =404;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
