[program:playnova-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/playnnu/domains/playnova.ir/public_html/PlayNova/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/home/playnnu/domains/playnova.ir/public_html/PlayNova/storage/logs/worker.log
stopwaitsecs=3600
